<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Campus Marketplace | Domasi Hub</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header class="main-header">
        <div class="logo">
            <h1><a href="index.html" style="color: white; text-decoration: none;">Domasi Hub</a></h1>
        </div>
        <nav class="main-nav">
            <div class="theme-switch-wrapper">
                <button id="themeToggle" class="theme-toggle-btn" aria-label="Toggle Dark Mode">
                    <span class="toggle-track">
                        <span class="toggle-thumb"></span>
                    </span>
                </button>
            </div>
            <a href="index.html" class="btn-secondary">Home</a>
        </nav>
    </header>

    <main class="marketplace-container">
        <section class="section-title">
            <h3>Campus Marketplace</h3>
            <p>Buy or sell academic essentials directly via WhatsApp.</p>
        </section>

        <section id="productsGrid" class="products-grid"></section>
    </main>

    <footer class="main-footer">
        <p>&copy; 2026 Domasi Hub.</p>
    </footer>

    <script src="theme.js"></script>

    <script>
        document.addEventListener('DOMContentLoaded', async () => {
            const grid = document.getElementById('productsGrid');
            try {
                const response = await fetch('/api/marketplace');
                const items = await response.json();

                if (!items.length) {
                    grid.innerHTML = '<p class="auth-subtitle">No marketplace listings yet.</p>';
                    return;
                }

                grid.innerHTML = items.map(item => `
                    <div class="product-card">
                        <div class="product-badge">${item.category}</div>
                        <div class="product-info">
                            <h4>${item.title}</h4>
                            <p class="product-price">MK ${Number(item.price).toLocaleString()}</p>
                            <p class="product-condition">Condition: ${item.condition_text}</p>
                            <p class="product-seller">Seller: ${item.seller_name}</p>
                            <p class="product-seller">${item.description || ''}</p>
                            <a href="https://wa.me/${item.seller_phone}?text=Hi%20${encodeURIComponent(item.seller_name)},%20I'm%20interested%20in%20your%20${encodeURIComponent(item.title)}%20on%20Domasi%20Hub" target="_blank" class="btn-primary btn-marketplace">Chat on WhatsApp</a>
                        </div>
                    </div>
                `).join('');
            } catch (error) {
                console.error(error);
                grid.innerHTML = '<p class="auth-subtitle">Unable to load listings right now.</p>';
            }
        });
    </script>
</body>
</html>
